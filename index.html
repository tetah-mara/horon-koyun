<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horon Koyun Sayacı</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top">
    <div class="wrap">
      <div class="brand">Horon Koyun Sayacı 🐑</div>
      <div class="counter">Sayılan: <span id="count">0</span></div>
    </div>
  </header>

  <main class="wrap">
    <section class="stage">
      <div class="hint">Başlat’a bas — koyunlar horonla geçsin 😄</div>
      <div id="lane" class="lane"></div>
    </section>

    <section class="controls">
      <button id="start" class="btn primary">Başlat</button>
      <button id="stop" class="btn">Durdur</button>
      <button id="musicBtn" class="btn">🎵 Müzik</button>
    </section>
  </main>

  <!-- YouTube gizli player -->
  <div style="position:absolute; width:0; height:0; overflow:hidden;">
    <iframe 
      id="ytplayer"
      width="0"
      height="0"
      src="https://www.youtube.com/embed/hUdWILxC8sY?enablejsapi=1"
      frameborder="0"
      allow="autoplay">
    </iframe>
  </div>

  <script src="app.js"></script>

  <!-- YouTube API -->
  <script>
    let player;
    let musicPlaying = false;

    // API script yükle
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer');
    }

    const musicBtn = document.getElementById("musicBtn");

    musicBtn.addEventListener("click", () => {
      if (!player) return;

      if (!musicPlaying) {
        player.playVideo();
        musicBtn.textContent = "⏸ Müzik Durdur";
        musicPlaying = true;
      } else {
        player.pauseVideo();
        musicBtn.textContent = "🎵 Müzik";
        musicPlaying = false;
      }
    });
  </script>

</body>
</html>
